# LeetCode tags that map to no topic. They stay on the problem as plain tags,
# and a bank refresh doesn't report them as unknown (SPEC §5.4).
unmapped_tags: [Segment Tree, Binary Indexed Tree, Interactive]

# Problems carrying any of these are left out of the bank (SPEC §5.4).
excluded_tags: [Database, Shell, Concurrency]

# NeetCode category → topic, tried before the tag priority for problems in
# the NeetCode list (Appendix C). null: no topic, use the tag priority.
# Categories missing here ("JavaScript") also fall through.
neetcode_categories:
  Arrays & Hashing: null
  Two Pointers: two-pointers
  Sliding Window: sliding-window
  Stack: stack
  Binary Search: binary-search
  Linked List: linked-list
  Trees: tree
  Tries: trie
  Heap / Priority Queue: priority-queue
  Backtracking: backtracking
  Graphs: graph
  Advanced Graphs: graph
  1-D Dynamic Programming: dynamic-programming
  2-D Dynamic Programming: dynamic-programming
  Greedy: greedy
  Intervals: sweep-line
  Math & Geometry: math
  Bit Manipulation: bit-manipulation
